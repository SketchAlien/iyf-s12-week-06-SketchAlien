<!DOCTYPE html>

<html lang="en">

<head>

    <title>Search Directory</title>

    <style>

        .hidden { display: none; }

        .user-card { border: 1px solid #ccc; padding: 10px; margin: 10px 0; border-radius: 5px; }

        .error { color: red; }

        #search { padding: 8px; width: 100%; margin-bottom: 20px; max-width: 300px; }

        <div id="error" class="hidden error"></div>

        <div id="users-container"></div>

    </div>

    <script src="search-directory.js"></script>

</body>

</html>
